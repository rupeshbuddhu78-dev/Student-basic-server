<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student CRUD App</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #218838; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #007bff; color: white; }
        .action-btn { padding: 5px 10px; margin: 2px; font-size: 12px; }
        .edit-btn { background: #ffc107; color: black; }
        .del-btn { background: #dc3545; }
    </style>
</head>
<body>

    <div class="container">
        <h2>📚 Student Record System</h2>
        
        <input type="hidden" id="studentId">
        <input type="text" id="name" placeholder="Student Name" required>
        <input type="text" id="className" placeholder="Class" required>
        <input type="number" id="roll" placeholder="Roll Number" required>
        <input type="text" id="city" placeholder="City" required>
        <br>
        <button id="saveBtn" onclick="saveStudent()">Add Student</button>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Class</th>
                    <th>Roll</th>
                    <th>City</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="studentTable">
                </tbody>
        </table>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api/students';

        // 1. FETCH & DISPLAY DATA (Read)
        async function fetchStudents() {
            const res = await fetch(API_URL);
            const data = await res.json();
            
            let tableContent = '';
            data.forEach(student => {
                tableContent += `
                    <tr>
                        <td>${student.name}</td>
                        <td>${student.className}</td>
                        <td>${student.roll}</td>
                        <td>${student.city}</td>
                        <td>
                            <button class="action-btn edit-btn" onclick="editStudent('${student._id}', '${student.name}', '${student.className}', '${student.roll}', '${student.city}')">Edit</button>
                            <button class="action-btn del-btn" onclick="deleteStudent('${student._id}')">Delete</button>
                        </td>
                    </tr>
                `;
            });
            document.getElementById('studentTable').innerHTML = tableContent;
        }

        // 2. ADD OR UPDATE DATA (Create / Update)
        async function saveStudent() {
            const id = document.getElementById('studentId').value;
            const studentData = {
                name: document.getElementById('name').value,
                className: document.getElementById('className').value,
                roll: document.getElementById('roll').value,
                city: document.getElementById('city').value
            };

            if (id) {
                // Update Logic
                await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(studentData)
                });
                document.getElementById('saveBtn').innerText = "Add Student";
            } else {
                // Add Logic
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(studentData)
                });
            }

            // Form Clear karo aur nayi list load karo
            document.getElementById('studentId').value = '';
            document.getElementById('name').value = '';
            document.getElementById('className').value = '';
            document.getElementById('roll').value = '';
            document.getElementById('city').value = '';
            fetchStudents();
        }

        // 3. EDIT BUTTON LOGIC (Fill form for update)
        function editStudent(id, name, className, roll, city) {
            document.getElementById('studentId').value = id;
            document.getElementById('name').value = name;
            document.getElementById('className').value = className;
            document.getElementById('roll').value = roll;
            document.getElementById('city').value = city;
            
            document.getElementById('saveBtn').innerText = "Update Student";
        }

        // 4. DELETE DATA (Delete)
        async function deleteStudent(id) {
            if (confirm("Are you sure you want to delete this record?")) {
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                fetchStudents(); // Refresh table
            }
        }

        // Pehli baar page khulte hi data load karo
        fetchStudents();
    </script>
</body>
</html>
